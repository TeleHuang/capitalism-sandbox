[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capitalism-sandbox"
version = "0.3.0"
description = "封闭资本主义经济的多智能体沙盒"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "TeleHuang" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
ecosim = "ecosim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
