<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>资本主义经济模拟 · UI 原型</title>
  <style>
    :root {
      --ink: #24342b;
      --muted: #657568;
      --paper: #f4eedf;
      --panel: rgba(255, 252, 243, 0.92);
      --line: #c9bea7;
      --grass: #8fbf72;
      --field: #d9b44a;
      --river: #6eb7d6;
      --mountain: #8d8a86;
      --mountain-dark: #68645f;
      --steel: #6c7f91;
      --machinery: #d58a3a;
      --brick: #b65a45;
      --fertilizer: #4d9a86;
      --textile: #8b6aa8;
      --construction: #c99a42;
      --housing: #7f9bb5;
      --green: #2f8f4e;
      --red: #dc2626;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, #fff9e8 0, transparent 36%),
        radial-gradient(circle at 88% 90%, #e7ddc2 0, transparent 42%),
        var(--paper);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    button { font: inherit; color: inherit; }
    .hidden { display: none !important; }

    /* ---------- 开始界面 ---------- */
    .screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 20%, rgba(255,255,255,0.75), transparent 32%),
        radial-gradient(circle at 80% 80%, rgba(208,193,157,0.5), transparent 40%),
        rgba(244, 238, 223, 0.97);
    }
    .start-card {
      width: min(720px, 100%);
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 252, 245, 0.96);
      box-shadow: 0 24px 70px rgba(69, 60, 41, 0.16);
    }
    .eyebrow {
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 { margin: 8px 0 8px; font-size: clamp(30px, 5vw, 48px); letter-spacing: -0.03em; }
    .lead { margin: 0 0 26px; color: var(--muted); line-height: 1.7; }
    .start-section { margin-top: 22px; }
    .start-section h2 { margin: 0 0 10px; font-size: 15px; }
    .scenario-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 10px; }
    .scenario {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbf6e9;
      text-align: left;
      cursor: pointer;
      min-width: 0;
      overflow: hidden;
    }
    .scenario.active { border-color: var(--green); box-shadow: 0 0 0 3px rgba(47,143,78,0.12); }
    .scenario:disabled { opacity: 0.48; cursor: not-allowed; }
    .scenario strong { display: block; margin-bottom: 4px; }
    .scenario small { color: var(--muted); line-height: 1.5; }
    .duration { display: flex; flex-wrap: wrap; gap: 8px; }
    .duration button {
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fbf6e9;
      cursor: pointer;
    }
    .duration button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .primary {
      width: 100%;
      margin-top: 26px;
      padding: 15px 18px;
      border: 0;
      border-radius: 14px;
      background: var(--green);
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(47,143,78,0.22);
    }
    .primary:hover { filter: brightness(1.06); }
    .fine { margin: 14px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }

    /* ---------- 主界面 ---------- */
    .app { max-width: 1480px; margin: 0 auto; padding: 16px 18px 30px; overflow-x: hidden; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 4px 2px 14px;
    }
    .brand h1 { margin: 0; font-size: clamp(20px, 2.4vw, 30px); }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .ghost {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,252,243,0.7);
      cursor: pointer;
      font-size: 12px;
    }
    .ghost:hover { background: #fffaf0; }
    .overview {
      display: grid;
      grid-template-columns: minmax(240px, 292px) minmax(0, 1fr) minmax(240px, 292px);
      gap: 16px;
      align-items: start;
    }
    .side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .card {
      width: 100%;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(69, 60, 41, 0.06);
      text-align: left;
      cursor: pointer;
      min-width: 0;
      overflow: hidden;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(69, 60, 41, 0.12); }
    .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .card-title { font-size: 13px; font-weight: 800; color: #3b513f; }
    .card-arrow { color: #8b9a8c; font-size: 15px; }
    .card-value { margin-top: 8px; font-size: 29px; font-weight: 850; letter-spacing: -0.04em; }
    .card-sub { color: var(--muted); font-size: 12px; }
    .card-rows { display: flex; flex-wrap: wrap; gap: 5px 12px; margin-top: 10px; color: #4f6153; font-size: 12px; }
    .card-rows span { white-space: nowrap; }
    @media (max-width: 640px) { .card-rows span { white-space: normal; } }
    .spark { width: 100%; height: 34px; margin-top: 8px; display: block; overflow: visible; }
    .map-panel {
      min-width: 0;
      padding: 6px 2px 0;
    }
    #map { width: 100%; height: auto; display: block; filter: drop-shadow(0 14px 28px rgba(60,54,38,0.14)); }
    .map-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 16px;
      margin-top: -2px;
      color: var(--muted);
      font-size: 11px;
    }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .legend-scale { color: #22a34f; font-weight: 900; }
    .legend-count { color: var(--red); font-weight: 900; }

    /* ---------- 地图 SVG ---------- */
    .hex { stroke: #5f7a57; stroke-width: 3; }
    .tile-label {
      font-size: 22px; font-weight: 800; fill: #2c402f;
      paint-order: stroke; stroke: rgba(255,255,255,0.72); stroke-width: 5px; pointer-events: none;
    }
    .entity { cursor: pointer; }
    .entity:hover { filter: brightness(1.08); }
    .scale-badge {
      font-size: 19px; font-weight: 800; fill: #22c55e;
      stroke: #fff; stroke-width: 5px; paint-order: stroke; pointer-events: none;
    }
    .count-badge { fill: var(--red); stroke: #fff; stroke-width: 2.5; }
    .count-text { fill: #fff; font-size: 15px; font-weight: 800; text-anchor: middle; pointer-events: none; }
    .entity-label {
      font-size: 13px; font-weight: 700; fill: #223426; text-anchor: middle;
      paint-order: stroke; stroke: rgba(255,255,255,0.8); stroke-width: 4px; pointer-events: none;
    }
    .small-note {
      font-size: 11px; fill: #3f5142; text-anchor: middle;
      paint-order: stroke; stroke: rgba(255,255,255,0.8); stroke-width: 4px; pointer-events: none;
    }
    #tooltip {
      position: fixed; z-index: 80; max-width: 280px; padding: 10px 12px;
      border: 1px solid #b8ae95; border-radius: 10px;
      background: rgba(255,252,243,0.98); box-shadow: 0 8px 24px rgba(50,45,32,0.2);
      font-size: 13px; line-height: 1.55; pointer-events: none; opacity: 0;
      transform: translate(-50%, -110%); transition: opacity 120ms ease;
    }
    #tooltip.show { opacity: 1; }
    #tooltip strong { color: #2e4a34; }

    /* ---------- 详情视图 ---------- */
    .detail {
      position: fixed; inset: 0; z-index: 60;
      display: flex; align-items: center; justify-content: center;
      padding: 22px; background: rgba(35, 45, 38, 0.38);
      backdrop-filter: blur(3px);
    }
    .detail-panel {
      width: min(860px, 100%); max-height: 88vh; overflow: auto;
      padding: 24px; border: 1px solid var(--line); border-radius: 20px;
      background: #fffcf5; box-shadow: 0 24px 70px rgba(40,36,26,0.25);
    }
    .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .detail-head h2 { margin: 0; font-size: 24px; }
    .detail-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .close-detail { border: 0; background: transparent; font-size: 28px; line-height: 1; cursor: pointer; color: #6d7a6f; }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 20px 0; }
    .kpi { padding: 12px; border-radius: 12px; background: #f5efe1; }
    .kpi b { display: block; font-size: 19px; margin-bottom: 3px; }
    .kpi span { color: var(--muted); font-size: 11px; }
    .detail-chart { width: 100%; height: 180px; display: block; margin: 8px 0 18px; }
    .detail-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .detail-table th, .detail-table td { padding: 9px 8px; border-bottom: 1px solid #e5dccb; text-align: left; }
    .detail-table th { color: var(--muted); font-weight: 700; }
    .detail-table td:last-child { text-align: right; }

    /* ---------- 竖屏 / 窄屏：数字 UI 在上下 ---------- */
    @media (max-width: 1050px) {
      .overview { grid-template-columns: 1fr; }
      .side { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .side.left { order: 1; }
      .map-panel { order: 2; }
      .side.right { order: 3; }
      .map-panel { padding: 0; }
    }
    @media (max-width: 640px) {
      html, body { width: 100%; max-width: 100%; }
      .app { width: 100vw; max-width: 100vw; padding: 10px 10px 24px; }
      .overview, .side, .map-panel { width: 100%; max-width: 100%; min-width: 0; }
      .topbar { align-items: flex-start; }
      .brand h1 { font-size: 20px; }
      .brand p { font-size: 11px; }
      .top-actions .ghost { padding: 7px 9px; }
      .side { grid-template-columns: 1fr 1fr; gap: 8px; }
      .card { padding: 12px; border-radius: 13px; }
      .card-value { font-size: 24px; }
      .card-rows { font-size: 11px; }
      .map-legend { font-size: 10px; gap: 7px 10px; width: 100%; max-width: 100%; margin-left: auto; margin-right: auto; }
      .map-panel { padding: 0 10px; }
      #map { width: 92%; max-width: 100%; margin: 0 auto; }
      .card { max-width: 100%; }
      .card svg { max-width: 100%; }
      .side, .map-panel { width: calc(100vw - 20px) !important; max-width: calc(100vw - 20px) !important; }
      .card { width: 100% !important; }
      .map-legend { width: 100% !important; }
      #map { width: 90% !important; }
      .start-card { padding: 24px 20px; border-radius: 18px; }
      .scenario-grid { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: 1fr 1fr; }
      .detail-panel { padding: 18px; }
    }
    @media (orientation: portrait) and (max-width: 700px) {
      .side { grid-template-columns: 1fr; }
    }
    @media (max-width: 540px) {
      .side { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- 开始界面 -->
  <div id="start-screen" class="screen">
    <div class="start-card">
      <div class="eyebrow">BETA V0.3.2 · UI 原型</div>
      <h1>资本主义经济模拟</h1>
      <p class="lead">一个封闭经济体的月度沙盒。选择剧本和仿真长度，观察阶级、产业、市场与城市的演化。</p>

      <div class="start-section">
        <h2>选择剧本</h2>
        <div class="scenario-grid">
          <button class="scenario active" data-scenario="industrial">
            <strong>第一次工业革命</strong>
            <small>600 名自耕农、500 名工业工人、100 名资产阶级；农业紧平衡，工业开始积累。</small>
          </button>
          <button class="scenario" disabled>
            <strong>晚期资本主义</strong>
            <small>尚未实现。高资本积累、利润率下降与危机场景。</small>
          </button>
        </div>
      </div>

      <div class="start-section">
        <h2>仿真时长</h2>
        <div class="duration" id="duration-options">
          <button class="active" data-years="20">20 年</button>
          <button data-years="50">50 年</button>
          <button data-years="100">100 年</button>
        </div>
      </div>

      <button id="start-btn" class="primary">开始游戏</button>
      <p class="fine">当前只有“第一次工业革命”剧本可用；界面中的数字为示例数据，尚未接入仿真引擎。</p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <h1>资本主义经济模拟</h1>
        <p>总览 · <span id="scenario-label">第一次工业革命</span> · 目标 <span id="duration-label">20 年 / 240 月</span> · 示例第 240 月</p>
      </div>
      <div class="top-actions">
        <button class="ghost" id="back-start">回到开始</button>
      </div>
    </header>

    <main class="overview">
      <aside class="side left" id="cards-left"></aside>
      <section class="map-panel">
        <svg id="map" viewBox="0 0 1200 930" role="img" aria-label="六边形地块经济地图"></svg>
        <div class="map-legend">
          <span class="legend-item"><span class="legend-dot" style="background:var(--grass)"></span>平原</span>
          <span class="legend-item"><span class="legend-dot" style="background:var(--mountain)"></span>山地</span>
          <span class="legend-item"><span class="legend-dot" style="background:var(--field)"></span>农田</span>
          <span class="legend-item"><span class="legend-scale">数字</span>规模等级</span>
          <span class="legend-item"><span class="legend-count">×N</span>合并数量</span>
        </div>
      </section>
      <aside class="side right" id="cards-right"></aside>
    </main>
  </div>

  <!-- 领域详情 -->
  <div id="detail" class="detail hidden">
    <div class="detail-panel">
      <div class="detail-head">
        <div>
          <h2 id="detail-title">领域详情</h2>
          <p id="detail-subtitle"></p>
        </div>
        <button class="close-detail" id="close-detail" aria-label="关闭">×</button>
      </div>
      <div class="kpi-grid" id="detail-kpis"></div>
      <svg class="detail-chart" id="detail-chart" viewBox="0 0 760 180" aria-label="趋势图"></svg>
      <table class="detail-table">
        <thead><tr><th>指标</th><th>数值</th></tr></thead>
        <tbody id="detail-rows"></tbody>
      </table>
    </div>
  </div>

  <div id="tooltip"></div>

  <script>
    // ---------- 示例数据（后续替换为 Python 导出的 run JSON） ----------
    const SAMPLE = {
      tick: 240,
      population: { alive: 1059, unemployment: "0.0%", agriculture: 213, industry: 846 },
      agriculture: { capitalistFarms: 41, householdFarms: 213, machinery: 67, fertilizer: 28.4, landPrice: 156, productivity: 0.31, food: 168.7 },
      city: { housing: 212, occupancy: "94%", housingPrice: 90, textile: 4, construction: 5 },
      industry: { firms: 632, sectors: 9, utilization: "64%", steel: 300, machinery: 10 },
      market: { food: 90, coal: 17.49, steel: 50.4, machinery: 376, building: 142.4, cloth: 1.18 },
      finance: { money: 5877000, bank: 79198, loans: 20880, profit: "-0.37%", investment: 0, gdp: 9665 }
    };

    const DOMAINS = {
      population: {
        title: "人口与阶级", subtitle: "存活人口、就业结构与生活标准",
        value: SAMPLE.population.alive.toLocaleString(), unit: "存活人口",
        rows: [`失业率 ${SAMPLE.population.unemployment}`, `农业就业 ${SAMPLE.population.agriculture}`, `工业就业 ${SAMPLE.population.industry}`],
        color: "#2f8f4e", spark: [1100, 1098, 1096, 1090, 1070, 1059],
        kpis: [["存活人口", "1,059"], ["失业率", "0.0%"], ["农业就业", "213"], ["工业就业", "846"]],
        table: [["劳动年龄人口", "1,059"], ["失业", "0"], ["生存/温饱线", "约 18%"], ["小康/悠闲", "约 82%"]]
      },
      agriculture: {
        title: "农业与土地", subtitle: "资本主义农场、农机、化肥与土地价格",
        value: SAMPLE.agriculture.productivity.toFixed(2), unit: "农业劳动生产率（吨/人）",
        rows: [`资本主义农场 ${SAMPLE.agriculture.capitalistFarms}`, `农机 ${SAMPLE.agriculture.machinery} 台`, `化肥 ${SAMPLE.agriculture.fertilizer} 吨/月`],
        color: "#6a9b45", spark: [0.20, 0.21, 0.24, 0.27, 0.30, 0.31],
        kpis: [["资本主义农场", "41"], ["自耕农农场", "213"], ["化肥使用", "28.4 吨/月"], ["地价", "156 元/亩"]],
        table: [["粮食产出", "168.7 吨/月"], ["农业劳动生产率", "0.31 吨/人"], ["农机数量", "67 台"], ["土地价格", "156 元/亩"]]
      },
      city: {
        title: "城市与住房", subtitle: "住房、纺织厂与施工队",
        value: SAMPLE.city.occupancy, unit: "住房入住率",
        rows: [`住房消费 ${SAMPLE.city.housing} ㎡/月`, `纺织厂 ${SAMPLE.city.textile}`, `施工队 ${SAMPLE.city.construction}`],
        color: "#7f9bb5", spark: [84, 86, 88, 91, 93, 94],
        kpis: [["住房入住率", "94%"], ["住房消费", "212 ㎡/月"], ["纺织厂", "4"], ["施工队", "5"]],
        table: [["住房价格", "90 元/㎡"], ["城市就业", "纺织 + 施工"], ["住房需求", "约 212 ㎡/月"], ["空置率", "6%"]]
      },
      industry: {
        title: "企业与产业", subtitle: "企业数量、产能利用率与重工业产出",
        value: SAMPLE.industry.firms, unit: "活跃企业",
        rows: [`行业 ${SAMPLE.industry.sectors}`, `产能利用率 ${SAMPLE.industry.utilization}`, `钢铁 ${SAMPLE.industry.steel} 吨/月`],
        color: "#c07b3a", spark: [560, 580, 600, 620, 628, 632],
        kpis: [["活跃企业", "632"], ["行业", "9"], ["钢铁产出", "300 吨/月"], ["机械产出", "10 台/月"]],
        table: [["企业数量", "632"], ["行业数量", "9"], ["产能利用率", "64%"], ["机械厂数量", "1"]]
      },
      market: {
        title: "市场与物价", subtitle: "主要商品价格与供需概况",
        value: SAMPLE.market.food.toFixed(0), unit: "粮食价格（元/吨）",
        rows: [`煤炭 ${SAMPLE.market.coal}`, `钢铁 ${SAMPLE.market.steel}`, `机械 ${SAMPLE.market.machinery}`],
        color: "#b38a35", spark: [100, 103, 105, 98, 91, 90],
        kpis: [["粮食", "90 元/吨"], ["煤炭", "17.5 元/吨"], ["钢铁", "50.4 元/吨"], ["机械", "376 元/台"]],
        table: [["粮食", "90 元/吨"], ["煤炭", "17.5 元/吨"], ["钢铁", "50.4 元/吨"], ["建筑", "142 元/㎡"]]
      },
      finance: {
        title: "金融与利润", subtitle: "货币总量、银行、投资与利润率",
        value: "5.877M", unit: "货币总量",
        rows: [`利润率 ${SAMPLE.finance.profit}`, `银行 ${(SAMPLE.finance.bank / 1000).toFixed(0)}k`, `贷款 ${(SAMPLE.finance.loans / 1000).toFixed(1)}k`],
        color: "#5d7b8d", spark: [-2.1, -1.4, -1.1, -0.8, -0.5, -0.37],
        kpis: [["货币总量", "5.877M"], ["全社会利润率", "-0.37%"], ["银行现金", "79k"], ["当月投资", "0"]],
        table: [["货币总量", "5,877,000"], ["银行现金", "79,198"], ["贷款余额", "20,880"], ["GDP", "9,665"]]
      }
    };

    const CARD_ORDER_LEFT = ["population", "agriculture", "city"];
    const CARD_ORDER_RIGHT = ["industry", "market", "finance"];

    function sparkline(values, color) {
      const w = 220, h = 34, pad = 3;
      const min = Math.min(...values), max = Math.max(...values);
      const span = max - min || 1;
      const points = values.map((v, i) => {
        const x = pad + (i / Math.max(values.length - 1, 1)) * (w - pad * 2);
        const y = h - pad - ((v - min) / span) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
      return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    }

    function renderCards(targetId, keys) {
      const target = document.getElementById(targetId);
      target.innerHTML = keys.map((key) => {
        const d = DOMAINS[key];
        return `<button class="card" data-domain="${key}">
          <div class="card-head"><span class="card-title">${d.title}</span><span class="card-arrow">↗</span></div>
          <div class="card-value">${d.value}</div>
          <div class="card-sub">${d.unit}</div>
          <div class="card-rows">${d.rows.map((r) => `<span>${r}</span>`).join("")}</div>
          ${sparkline(d.spark, d.color)}
        </button>`;
      }).join("");
    }

    renderCards("cards-left", CARD_ORDER_LEFT);
    renderCards("cards-right", CARD_ORDER_RIGHT);

    // ---------- 开始界面 ----------
    let selectedYears = 20;
    let started = false;
    const startScreen = document.getElementById("start-screen");
    const app = document.getElementById("app");
    const durationLabel = document.getElementById("duration-label");

    document.querySelectorAll("#duration-options button").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll("#duration-options button").forEach((b) => b.classList.remove("active"));
        button.classList.add("active");
        selectedYears = Number(button.dataset.years);
      });
    });

    function startApp() {
      startScreen.classList.add("hidden");
      app.classList.remove("hidden");
      durationLabel.textContent = `${selectedYears} 年 / ${selectedYears * 12} 月`;
      started = true;
    }

    document.getElementById("start-btn").addEventListener("click", startApp);
    document.getElementById("back-start").addEventListener("click", () => {
      app.classList.add("hidden");
      startScreen.classList.remove("hidden");
      started = false;
    });

    // 允许用 ?view=overview 直接打开总览，便于截图/演示
    if (new URLSearchParams(location.search).get("view") === "overview") {
      startApp();
    }

    // ---------- 详情视图 ----------
    const detail = document.getElementById("detail");
    const detailTitle = document.getElementById("detail-title");
    const detailSubtitle = document.getElementById("detail-subtitle");
    const detailKpis = document.getElementById("detail-kpis");
    const detailChart = document.getElementById("detail-chart");
    const detailRows = document.getElementById("detail-rows");

    function renderDetail(key) {
      const d = DOMAINS[key];
      detailTitle.textContent = d.title;
      detailSubtitle.textContent = d.subtitle;
      detailKpis.innerHTML = d.kpis.map(([label, value]) => `<div class="kpi"><b>${value}</b><span>${label}</span></div>`).join("");
      const w = 760, h = 180, pad = 18;
      const values = d.spark;
      const min = Math.min(...values), max = Math.max(...values);
      const span = max - min || 1;
      const points = values.map((v, i) => {
        const x = pad + (i / Math.max(values.length - 1, 1)) * (w - pad * 2);
        const y = h - pad - ((v - min) / span) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
      detailChart.innerHTML = `
        <defs><linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${d.color}" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="${d.color}" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="M ${pad} ${h - pad} L ${points.replace(/ /g, " L ")} L ${w - pad} ${h - pad} Z" fill="url(#fillGrad)"/>
        <polyline points="${points}" fill="none" stroke="${d.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}" stroke="#dfd5c2" stroke-width="1"/>
      `;
      detailRows.innerHTML = d.table.map(([label, value]) => `<tr><td>${label}</td><td>${value}</td></tr>`).join("");
      detail.classList.remove("hidden");
    }

    document.querySelectorAll(".card").forEach((card) => {
      card.addEventListener("click", () => renderDetail(card.dataset.domain));
    });
    document.getElementById("close-detail").addEventListener("click", () => detail.classList.add("hidden"));
    detail.addEventListener("click", (event) => { if (event.target === detail) detail.classList.add("hidden"); });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") detail.classList.add("hidden"); });

    // ---------- 六边形地图 ----------
    const R = 155;
    const CX = 600;
    const CY = 465;
    const hexes = {
      city:        { cx: CX,        cy: CY,        label: "城市", terrain: "city" },
      machinery:   { cx: CX - 0.866 * R, cy: CY - 1.5 * R, label: "机械", terrain: "plain" },
      steel:       { cx: CX + 0.866 * R, cy: CY - 1.5 * R, label: "钢铁", terrain: "plain" },
      agriculture: { cx: CX - 1.732 * R, cy: CY,        label: "农业", terrain: "farm" },
      mine:        { cx: CX + 1.732 * R, cy: CY,        label: "矿场", terrain: "mine" },
      fertilizer:  { cx: CX - 0.866 * R, cy: CY + 1.5 * R, label: "化肥", terrain: "plain" },
      brick:       { cx: CX + 0.866 * R, cy: CY + 1.5 * R, label: "砖厂", terrain: "plain" }
    };

    const svg = document.getElementById("map");
    const tooltip = document.getElementById("tooltip");
    const NS = "http://www.w3.org/2000/svg";

    function el(name, attrs = {}, parent = svg) {
      const node = document.createElementNS(NS, name);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      parent.appendChild(node);
      return node;
    }

    function hexPoints(cx, cy, r) {
      const points = [];
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i + Math.PI / 6;
        points.push(`${(cx + r * Math.cos(angle)).toFixed(2)},${(cy + r * Math.sin(angle)).toFixed(2)}`);
      }
      return points.join(" ");
    }

    function drawTree(x, y, scale = 1) {
      const g = el("g", { transform: `translate(${x} ${y}) scale(${scale})` });
      el("rect", { x: -3, y: 14, width: 6, height: 18, rx: 2, fill: "#8a6540" }, g);
      el("circle", { cx: 0, cy: 2, r: 13, fill: "#4f8657" }, g);
      el("circle", { cx: -6, cy: 8, r: 9, fill: "#5f9864" }, g);
      el("circle", { cx: 7, cy: 9, r: 8, fill: "#3f714b" }, g);
    }

    function drawGrass(cx, cy, terrain) {
      const g = el("g", {});
      if (terrain === "farm") {
        el("path", { d: `M ${cx - 125} ${cy - 40} C ${cx - 70} ${cy - 15}, ${cx - 40} ${cy + 60}, ${cx + 20} ${cy + 70} S ${cx + 100} ${cy + 40}, ${cx + 125} ${cy + 85}`, fill: "none", stroke: "var(--river)", "stroke-width": 12, "stroke-linecap": "round", opacity: 0.9 }, g);
        el("path", { d: `M ${cx - 125} ${cy - 40} C ${cx - 70} ${cy - 15}, ${cx - 40} ${cy + 60}, ${cx + 20} ${cy + 70} S ${cx + 100} ${cy + 40}, ${cx + 125} ${cy + 85}`, fill: "none", stroke: "#b8e4f1", "stroke-width": 4, "stroke-linecap": "round", opacity: 0.8 }, g);
        for (let row = 0; row < 3; row++) {
          for (let col = 0; col < 4; col++) {
            const x = cx - 78 + col * 44;
            const y = cy + 4 + row * 35;
            el("polygon", { points: `${x},${y} ${x + 40},${y - 4} ${x + 44},${y + 25} ${x + 3},${y + 30}`, fill: row % 2 ? "var(--field)" : "#b58a2f", stroke: "#f7e7a8", "stroke-width": 1.5, opacity: 0.95 }, g);
          }
        }
        drawTree(cx - 92, cy - 72, 0.95);
        drawTree(cx - 62, cy - 88, 0.8);
        drawTree(cx - 110, cy - 42, 0.75);
      } else if (terrain === "mine") {
        el("polygon", { points: `${cx - 125},${cy + 55} ${cx - 55},${cy - 95} ${cx + 10},${cy + 55}`, fill: "var(--mountain)", stroke: "#6c6862", "stroke-width": 3 }, g);
        el("polygon", { points: `${cx - 65},${cy - 65} ${cx - 40},${cy - 100} ${cx - 10},${cy - 65}`, fill: "#f0eee7", opacity: 0.95 }, g);
        el("polygon", { points: `${cx - 20},${cy + 55} ${cx + 45},${cy - 55} ${cx + 115},${cy + 55}`, fill: "var(--mountain-dark)", stroke: "#5a5650", "stroke-width": 3 }, g);
        el("path", { d: `M ${cx - 12} ${cy + 55} Q ${cx + 8} ${cy + 10}, ${cx + 28} ${cy + 55}`, fill: "#3f3a33", stroke: "#2f2b26", "stroke-width": 2 }, g);
      } else if (terrain === "city") {
        el("rect", { x: cx - 125, y: cy - 80, width: 62, height: 95, rx: 5, fill: "#cdb795", stroke: "#8f7d60", "stroke-width": 2 }, g);
        el("rect", { x: cx - 48, y: cy - 100, width: 82, height: 115, rx: 6, fill: "#dbc9aa", stroke: "#8f7d60", "stroke-width": 2 }, g);
        el("rect", { x: cx + 48, y: cy - 55, width: 58, height: 70, rx: 5, fill: "#c7ae86", stroke: "#8f7d60", "stroke-width": 2 }, g);
        for (let i = 0; i < 3; i++) {
          el("rect", { x: cx - 38, y: cy - 82 + i * 26, width: 12, height: 12, rx: 2, fill: "#6f8fa4" }, g);
          el("rect", { x: cx - 14, y: cy - 82 + i * 26, width: 12, height: 12, rx: 2, fill: "#6f8fa4" }, g);
        }
        el("path", { d: `M ${cx + 60} ${cy - 55} L ${cx + 60} ${cy - 90} L ${cx + 96} ${cy - 90}`, fill: "none", stroke: "#8f7d60", "stroke-width": 3 }, g);
      } else {
        drawTree(cx - 92, cy - 62, 0.9);
        drawTree(cx + 78, cy - 30, 0.75);
        drawTree(cx - 10, cy + 86, 0.65);
      }
      return g;
    }

    function factoryIcon(x, y, color, tier, count, label, name, detail) {
      const scale = 0.62 + tier * 0.045;
      const g = el("g", { class: "entity", transform: `translate(${x} ${y}) scale(${scale})`, "data-name": name, "data-detail": detail });
      el("rect", { x: -58, y: 0, width: 116, height: 58, rx: 8, fill: color, stroke: "#2f3b32", "stroke-width": 3 }, g);
      el("polygon", { points: "-66,0 0,-46 66,0", fill: color, stroke: "#2f3b32", "stroke-width": 3 }, g);
      el("rect", { x: 28, y: -42, width: 20, height: 34, rx: 4, fill: "#4b4b45", stroke: "#2f3b32", "stroke-width": 2 }, g);
      el("rect", { x: -40, y: 18, width: 26, height: 22, rx: 3, fill: "#f4e9c8", opacity: 0.9 }, g);
      el("rect", { x: 2, y: 18, width: 26, height: 22, rx: 3, fill: "#f4e9c8", opacity: 0.9 }, g);
      el("circle", { cx: -28, cy: 64, r: 13, fill: "#3d403b" }, g);
      el("circle", { cx: 28, cy: 64, r: 13, fill: "#3d403b" }, g);
      el("text", { class: "scale-badge", x: 48, y: -42 }, g).textContent = tier;
      if (count > 1) {
        el("circle", { class: "count-badge", cx: 44, cy: 72, r: 21 }, g);
        el("text", { class: "count-text", x: 44, y: 78 }, g).textContent = "×" + count;
      }
      el("text", { class: "entity-label", x: 0, y: 98 }, g).textContent = label;
      return g;
    }

    function drawEntity(tileKey, x, y, options) {
      const tile = hexes[tileKey];
      return factoryIcon(tile.cx + x, tile.cy + y, options.color, options.tier, options.count, options.label, options.name, options.detail);
    }

    function drawEquipment(cx, cy, name, count, scales, label, color) {
      const g = el("g", { class: "entity", transform: `translate(${cx} ${cy})`, "data-name": name, "data-detail": `${label}；数量 ${count}；规模 ${scales}` });
      el("rect", { x: -50, y: -18, width: 100, height: 44, rx: 9, fill: color, stroke: "#2f3b32", "stroke-width": 3 }, g);
      el("circle", { cx: -30, cy: 38, r: 16, fill: "#3d403b", stroke: "#20251f", "stroke-width": 2 }, g);
      el("circle", { cx: 30, cy: 38, r: 16, fill: "#3d403b", stroke: "#20251f", "stroke-width": 2 }, g);
      el("rect", { x: -22, y: -48, width: 44, height: 30, rx: 6, fill: color, stroke: "#2f3b32", "stroke-width": 3 }, g);
      el("circle", { cx: 0, cy: 0, r: 17, fill: "#f4e9c8", opacity: 0.9 }, g);
      el("text", { class: "scale-badge", x: 44, y: -38 }, g).textContent = String(scales).split("~").pop();
      el("circle", { class: "count-badge", cx: 42, cy: 58, r: 21 }, g);
      el("text", { class: "count-text", x: 42, y: 64 }, g).textContent = "×" + count;
      el("text", { class: "entity-label", x: 0, y: 92 }, g).textContent = name;
      el("text", { class: "small-note", x: 0, y: 112 }, g).textContent = `${label}：×${count} · 规模 ${scales}`;
      return g;
    }

    // 城市住房：一排小房子 + 入住率
    function drawHousing(cx, cy, occupancy) {
      const g = el("g", { class: "entity", transform: `translate(${cx} ${cy})`, "data-name": "住房", "data-detail": `住房消费 212 ㎡/月；入住率 ${occupancy}；住房价格 90 元/㎡` });
      [-26, 0, 26].forEach((x, index) => {
        const color = index === 1 ? "#e7dcc3" : "#d8c8aa";
        el("rect", { x: x - 13, y: 0, width: 26, height: 20, rx: 2, fill: color, stroke: "#7d6f57", "stroke-width": 2 }, g);
        el("polygon", { points: `${x - 17},0 ${x},-13 ${x + 17},0`, fill: "var(--housing)", stroke: "#5f7485", "stroke-width": 2 }, g);
        el("rect", { x: x - 4, y: 8, width: 8, height: 12, fill: "#6f8fa4" }, g);
      });
      el("text", { class: "entity-label", x: 0, y: 42 }, g).textContent = "住房";
      el("text", { class: "small-note", x: 0, y: 59 }, g).textContent = `入住率 ${occupancy}`;
      return g;
    }

    function drawTile(key) {
      const tile = hexes[key];
      const g = el("g", {});
      el("polygon", { class: "hex", points: hexPoints(tile.cx, tile.cy, R), fill: tile.terrain === "mine" ? "#a8a49c" : tile.terrain === "city" ? "#d8c7a7" : "#99c47d" }, g);
      el("polygon", { points: hexPoints(tile.cx, tile.cy - 2, R - 8), fill: "none", stroke: "rgba(255,255,255,0.35)", "stroke-width": 2 }, g);
      drawGrass(tile.cx, tile.cy, tile.terrain);
      const labelY = (key === "fertilizer" || key === "brick") ? tile.cy - 55 : tile.cy - 112;
      el("text", { class: "tile-label", x: tile.cx - 48, y: labelY }, g).textContent = tile.label;
      return g;
    }

    Object.keys(hexes).forEach(drawTile);

    // 示例企业数据（视觉演示，不是实时仿真）
    drawEntity("steel", 0, -22, { color: "var(--steel)", tier: 0, count: 3, label: "炼钢厂", name: "炼钢厂 ×3", detail: "规模 0；员工 12；月产约 300 吨钢" });
    drawEntity("machinery", 0, -20, { color: "var(--machinery)", tier: 0, count: 1, label: "机械厂", name: "机械厂", detail: "规模 0；员工 10；手工锻炉" });
    drawEntity("brick", 0, -18, { color: "var(--brick)", tier: 0, count: 12, label: "砖厂", name: "砖厂 ×12", detail: "规模 0；合并显示 12 座小砖窑" });
    drawEntity("fertilizer", 0, -18, { color: "var(--fertilizer)", tier: 0, count: 3, label: "化肥厂", name: "化肥厂 ×3", detail: "规模 0；员工 6；月产约 30 吨化肥" });

    drawEntity("city", -62, 52, { color: "var(--textile)", tier: 0, count: 4, label: "纺织厂", name: "纺织厂 ×4", detail: "规模 0；员工 20；月产约 2000 件布" });
    drawEntity("city", 62, 52, { color: "var(--construction)", tier: 0, count: 5, label: "施工队", name: "施工队 ×5", detail: "规模 0；员工 128；月产约 500 平米" });
    drawHousing(hexes.city.cx + 74, hexes.city.cy - 64, "94%");

    drawEquipment(hexes.agriculture.cx, hexes.agriculture.cy - 6, "农机", 67, "0~2", "农机", "var(--machinery)");
    drawEquipment(hexes.mine.cx, hexes.mine.cy - 8, "矿井设备", 24, "0~2", "矿井设备", "var(--steel)");

    // 悬停/点击 tooltip
    function moveTooltip(event) {
      tooltip.style.left = event.clientX + "px";
      tooltip.style.top = event.clientY + "px";
    }
    svg.querySelectorAll(".entity").forEach((node) => {
      node.addEventListener("mouseenter", (event) => {
        tooltip.innerHTML = `<strong>${node.dataset.name}</strong><br>${node.dataset.detail}`;
        tooltip.classList.add("show");
        moveTooltip(event);
      });
      node.addEventListener("mousemove", moveTooltip);
      node.addEventListener("mouseleave", () => tooltip.classList.remove("show"));
      node.addEventListener("click", (event) => {
        tooltip.innerHTML = `<strong>${node.dataset.name}</strong><br>${node.dataset.detail}`;
        tooltip.classList.add("show");
        moveTooltip(event);
      });
    });

    // 允许用 ?detail=population 直接打开某个详情，便于截图/演示
    const detailParam = new URLSearchParams(location.search).get("detail");
    if (detailParam && DOMAINS[detailParam]) {
      startApp();
      renderDetail(detailParam);
    }
  </script>
</body>
</html>
